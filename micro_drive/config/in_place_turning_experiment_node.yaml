in_place_turning_experiment_node:
  ros__parameters:
    # Velocity params
    start_angular_velocity_rad: 0.05 # angular velocity of the first run in the sweep
    angular_velocity_increment_rad: 0.02 # velocity increment added each successive run
    target_angular_velocity_rad: 1.6 # sweep stops once the next step would exceed this
    invert_rotation: false # true publishes the negative of the commanded velocity
    use_twist_stamped: true # false publishes geometry_msgs/Twist instead of TwistStamped on /controller/cmd_vel

    # Experiment timing params
    min_run_time_seconds: 2.0 # time needed for the robot to reach the steady-state rotation
    wait_time_seconds: 4.0 # pause after each run to observe the recoil transient
    publish_frequency_hz: 20.0 # rate of the /controller/cmd_vel and ~/state publishers

    # IMU params
    imu_frame: "imu_link" # IMU frame, used to find the "up" axis via tf
    base_frame: "base_link" # robot body frame, used to find the "up" axis via tf
    gyro_window_size: 20 # number of IMU samples averaged for the yaw-rate estimate
    max_imu_delta_seconds: 0.1 # max IMU-to-IMU dt accepted before a sample is discarded
